# Note: modern redpanda images auto-create topics by default
# (auto_create_topics_enabled=true) when a producer writes to a topic, but
# Flink's KafkaSource calls AdminClient.describeTopics() on startup, which
# does NOT trigger auto-create. So the topic must exist before the job is
# submitted the first time (see README).
services:
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9093,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9093,external://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  jobmanager:
    image: flink:1.20.5-java17
    container_name: jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    volumes:
      - ./flink-job/target:/opt/flink/usrlib
    depends_on:
      redpanda:
        condition: service_healthy

  taskmanager:
    image: flink:1.20.5-java17
    container_name: taskmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - ./flink-job/target:/opt/flink/usrlib
    depends_on:
      - jobmanager
